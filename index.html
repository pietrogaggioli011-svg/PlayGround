<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thunder Ninja: Cyber Storm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#eefcff;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud{position:fixed;inset:0;pointer-events:none}.brand{position:absolute;left:24px;top:18px;text-shadow:3px 3px #0b1d49;font-size:16px;font-weight:900;letter-spacing:2px}.brand b{display:block;font-size:27px;color:#56dfff}.bars{position:absolute;left:24px;top:66px;width:min(270px,34vw)}.bar{height:12px;border:2px solid #c5f8ff;background:#17253b;margin:5px 0;transform:skew(-16deg)}.bar i{display:block;height:100%;background:#55aaff;width:100%;box-shadow:0 0 12px #39caff}.bar.core i{background:#7cf7ff}.score{position:absolute;right:24px;top:18px;text-align:right;text-shadow:2px 2px #13264d}.score b{display:block;color:#ffe168;font-size:28px}.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:11px;color:#b9d0da;text-align:center;letter-spacing:.5px}.zone{position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);font-weight:900;font-size:34px;letter-spacing:8px;text-shadow:4px 4px #0a1836;opacity:0}.zone.show{animation:zone 2.2s ease-out}@keyframes zone{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}15%,65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
#touch{display:none;position:fixed;inset:auto 0 0 0;height:180px;pointer-events:none}#touch button{pointer-events:auto;position:absolute;border:2px solid rgba(178,244,255,.45);border-radius:50%;background:rgba(19,53,80,.48);color:#dffbff;font-size:20px;font-weight:900;touch-action:none}#pad{left:18px;bottom:20px;width:130px;height:130px;border-radius:50%!important}.mini{width:58px;height:58px}.up{right:86px;bottom:115px}.atk{right:18px;bottom:48px}.rush{right:92px;bottom:30px}.jump{right:18px;bottom:125px}@media(pointer:coarse),(max-width:800px){#touch{display:block}.controls{display:none}}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(5,11,25,.72),rgba(8,52,78,.32));z-index:5}.panel{text-align:center;width:min(560px,90vw);border:1px solid #65cde1;background:rgba(4,18,38,.88);box-shadow:0 0 50px #2b87b877;padding:30px}.panel h1{margin:0;font-size:42px;color:#dffcff;text-shadow:4px 4px #0a5b91}.panel h1 em{display:block;font-style:normal;font-size:18px;color:#5eeaff;letter-spacing:8px}.panel p{color:#bad0da}.panel button{margin:8px;padding:14px 24px;border:2px solid #64dff4;background:#12395a;color:white;font-weight:900;cursor:pointer;letter-spacing:1px}.panel button:hover{background:#1b6685}.hidden{display:none!important}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div class="brand">THUNDER NINJA <b>CYBER STORM</b></div><div class="bars"><div class="bar"><i id="hpbar"></i></div><div class="bar core"><i id="corebar"></i></div></div><div class="score">SCORE <b id="score">000000</b></div><div class="zone" id="zone">NEON DISTRICT</div><div class="controls">A D / WASD — MUOVI · K — CALCIO · J — PUGNO · L — THUNDER RUSH · SHIFT — SCHIVA · I — LANCI · P2: FRECCE / N M</div></div>
<div id="menu"><div class="panel"><h1>THUNDER NINJA<em>CYBER STORM</em></h1><p>Un'ombra d'acciaio nella tempesta</p><button id="single">SOLO</button><button id="coop">CO-OP 2 PLAYER</button></div></div>
<div id="touch"><div id="pad"></div><button class="mini up" data-key="w">▲</button><button class="mini jump" data-key="w">JUMP</button><button class="mini atk" data-key="j">ATK</button><button class="mini rush" data-key="l">RUSH</button></div>
<script src="game.js"></script>
</body></html>
